[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-doctor-assistant"
version = "0.1.0"
description = "Pipecat voice assistant for doctor appointment booking"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[google,runner,webrtc]>=1.17,<1.18",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.1",
]

[project.scripts]
doctor-assistant = "backend.app.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]
